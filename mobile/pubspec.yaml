name: paisa_vault
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.8
  cryptography: ^2.9.0
  drift: ^2.35.4
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.4
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  llamadart: 0.19.5
  llamadart_llama_cpp_flutter: 0.19.5
  local_auth: ^3.0.2
  logging: ^1.3.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true

# Encrypted SQLite: use the SQLite3 Multiple Ciphers build (SQLCipher-compatible mode is set in code).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
